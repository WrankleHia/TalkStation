<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TalkStation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="auth" class="auth-page">
    <section class="brand-panel">
      <div class="brand-mark">T</div>
      <div>
        <p class="eyebrow">WELCOME TO TALKSTATION</p>
        <h1>连接每一种<br>有趣的声音</h1>
        <p class="brand-desc">与好友保持联系，让每次分享都简单、自然。</p>
      </div>
      <div class="orbit"><span></span><span></span><span></span></div>
      <p class="copyright">© 2026 TalkStation · 安全即时通讯</p>
    </section>
    <section class="auth-panel">
      <div class="auth-card">
        <div class="mobile-logo"><i>T</i> TalkStation</div>
        <div class="auth-tabs">
          <button class="active" data-auth-tab="login">登录</button>
          <button data-auth-tab="register">注册</button>
        </div>
        <form id="login-form">
          <h2>欢迎回来</h2><p class="muted">登录后开始与好友畅聊</p>
          <label>账号</label><input id="login-account" placeholder="请输入账号" required>
          <label>密码</label><div class="password"><input id="login-password" type="password" placeholder="请输入密码" required><button type="button" class="eye">◉</button></div>
          <div class="form-row"><label class="check"><input type="checkbox" checked> 记住我</label><button type="button" class="link">忘记密码？</button></div>
          <button class="primary wide" type="submit">登 录</button>
          <div class="divider"><span>或</span></div>
          <button class="guest wide" type="button" id="guest-login">以游客身份体验</button>
          <p class="tip">游客仅可浏览界面，聊天与好友功能将受限</p>
        </form>
        <form id="register-form" class="hidden">
          <h2>创建账号</h2><p class="muted">加入 TalkStation，遇见你的朋友</p>
          <label>昵称</label><input id="reg-name" placeholder="给自己取个名字" required>
          <label>账号</label><input id="reg-account" placeholder="设置登录账号" required>
          <label>密码</label><input id="reg-password" type="password" placeholder="至少 6 位密码" minlength="6" required>
          <label>确认密码</label><input id="reg-confirm" type="password" placeholder="再次输入密码" required>
          <button class="primary wide" type="submit">注 册</button>
          <p class="tip">注册即代表同意《用户协议》和《隐私政策》</p>
        </form>
      </div>
    </section>
  </div>

  <div id="app" class="app hidden">
    <div class="window-drag-region" aria-hidden="true"></div>
    <aside class="rail">
      <div class="rail-logo">T</div>
      <nav>
        <button class="rail-btn active" data-view="messages" title="消息">◌<span>消息</span></button>
        <button class="rail-btn" data-view="contacts" title="联系人">♙<span>联系人</span></button>
        <button class="rail-btn" data-view="groups" title="群聊">♧<span>群聊</span></button>
        <button class="rail-btn" data-view="files" title="文件">▱<span>文件</span></button>
      </nav>
      <div class="rail-bottom">
        <button class="rail-btn" id="settings-btn">⚙<span>设置</span></button>
        <button class="avatar me" id="profile-btn">我<span class="online-dot"></span></button>
      </div>
    </aside>

    <aside class="sidebar">
      <header class="side-head">
        <div><h2 id="view-title">消息</h2><p id="status-text">12 条未读消息</p></div>
        <button class="icon-btn" id="add-btn" title="好友申请、添加好友或群聊">＋<span id="request-badge" class="request-badge hidden">0</span></button>
      </header>
      <div class="search"><span>⌕</span><input id="search" placeholder="搜索联系人、群聊或消息"><kbd>⌘ K</kbd></div>
      <div class="filter-tabs"><button class="active" data-filter="all">全部</button><button data-filter="unread">未读</button><button data-filter="group">群聊</button></div>
      <div id="conversation-list" class="conversation-list"></div>
      <div class="user-card">
        <div class="avatar me">我<span class="online-dot"></span></div>
        <div><strong id="current-name">林默</strong><small id="identity-label">在线</small></div>
        <button id="logout-btn" title="退出登录">↪</button>
      </div>
    </aside>

    <main class="workspace">
      <div id="chat-tabs" class="chat-tabs"></div>
      <section id="chat" class="chat">
        <header class="chat-head">
          <div class="chat-person"><div id="chat-avatar" class="avatar blue"></div><div><h3 id="chat-name"></h3><p><span class="green-dot"></span><span id="chat-status"></span></p></div></div>
          <div class="chat-actions"><button id="more-btn" title="聊天信息">•••</button></div>
        </header>
        <div id="messages" class="messages"></div>
        <footer class="composer">
          <div class="compose-tools">
            <button id="emoji-btn" title="表情" aria-label="表情"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.2 2 3.5 2 3.5-2 3.5-2M9 9.5h.01M15 9.5h.01"/></svg></button>
            <button id="image-btn" title="发送图片" aria-label="发送图片"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 3.5 3 2.5-2 5 4"/></svg></button>
            <button id="file-btn" title="发送文件" aria-label="发送文件"><svg viewBox="0 0 24 24"><path d="m9.5 12.5 5.8-5.8a3 3 0 0 1 4.2 4.2l-7.8 7.8a5 5 0 0 1-7.1-7.1l7.5-7.5"/><path d="m7.5 14.5 7.2-7.2"/></svg></button>
            <button id="voice-btn" title="录制语音" aria-label="录制语音"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></svg></button>
            <span>Enter 发送 · Shift + Enter 换行</span>
          </div>
          <div class="compose-row"><textarea id="message-input" rows="1" placeholder="输入消息..."></textarea><button id="send-btn" class="send">➤</button></div>
          <div id="emoji-panel" class="emoji-panel hidden"></div>
        </footer>
      </section>
      <section id="empty-chat" class="empty-chat hidden"><div class="empty-visual"><div class="empty-logo">T</div><i></i><i></i><i></i></div><h2>让对话自然发生</h2><p>添加好友，或创建一个属于你们的群聊</p><button id="empty-add-btn" class="empty-action">开始连接</button></section>
    </main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-card"><button class="modal-close">×</button><div id="modal-content"></div></div></div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
